<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G6 Flights</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='homepage/css/styles.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url("{{ url_for('static', filename='homepage/images/Background.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.8);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 10;
        }
    
        .top-nav a {
            margin: 0 10px;
            color: #333;
            text-decoration: none;
        }
    
        /* 固定菜单样式 */
        .image-menu {
            position: fixed;
            top: 60px; 
            left: 10px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            z-index: 10;
            width: 150px;
        }
    
        .image-menu ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
    
        .image-menu li {
            margin: 10px 0;
        }

        .welcome-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding-top: 100px; 
            padding-bottom: 20px;
        }
    
        .overlay {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
    
        .welcome-image {
            width: 100%;
            height: auto;
            margin-bottom: 15px;
        }
    
        .booking-form {
            width: 100%;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
    
        .form-group {
            flex: 1;
            min-width: 100px;
        }
    
        .search-group {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
    
        .search-button img {
            width: 50px;
            height: 50px;
        }
    
        @media (max-width: 768px) {
            .top-nav {
                flex-direction: column;
                padding: 10px;
            }
    
            .top-nav a {
                margin: 5px 0;
                font-size: 14px;
            }
    
            .image-menu {
                position: absolute;
                top: 70px;
                width: 90%;
                left: 5%;
            }
    
            .welcome-section {
                padding-top: 150px;
            }
    
            .overlay {
                width: 95%;
                padding: 15px;
            }
    
            .form-row {
                flex-direction: column;
            }
    
            .search-button img {
                width: 40px;
                height: 40px;
            }
        }
    </style>
    
</head>
<body>

    <!-- Top navigation bar -->
    <div class="top-nav">
        <a href="{{ url_for('login_page') }}">{{ current_username }}</a>
        <a href="{{ url_for('passenger_info') }}">passenger information</a>
    </div>

    <!-- Fixed Menu with Background Image -->
    <div id="imageMenu" class="image-menu" style="width: {{ '150px' if current_username != 'Login / Sign up' else '200px' }} ; ">
        <ul>
            <li><a href="{{ url_for('booking_history') }}">Booking History</a></li>
            {% if current_username == "Login / Sign up" %}
            <li><a href="{{ url_for('login_page') }}">Login</a></li>
            {% endif %}
            <li><a href="{{ url_for('logout') }}">Logout</a></li>
        </ul>
    </div>

    <!-- Main content with background image -->
    <section class="welcome-section" style="background-image: url('{{ url_for('static', filename='homepage/images/Background.jpg') }}');">
        <div class="overlay">
            <img src="{{ url_for('static', filename='homepage/images/Welcome to G6 flights.png') }}" alt="Welcome" class="welcome-image">
            <div class="booking-form">
                <h2 class="form-title">Booking process</h2>

                <!-- Trip Type Selection -->
                <form method="POST" action="/search-results">
                    <div class="form-row radio-row">
                        <label>
                            <input type="radio" name="trip" value="oneway" checked> Oneway
                        </label>
                        <label>
                            <input type="radio" name="trip" value="roundtrip"> Round trip
                        </label>
                    </div>

                    <!-- Form Fields -->
                    <div class="form-row">
                        <div class="form-group">
                            <label>From:</label>
                            <input type="text" name="from_city" placeholder="Enter departure city" required>
                        </div>
                        <div class="form-group">
                            <label>To:</label>
                            <input type="text" name="to_city" placeholder="Enter destination city" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Travellers and class:</label>
                            <select name="travellers_class">
                                <option value="1 Traveller">1 Traveller</option>
                                <option value="2 Travellers">2 Travellers</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Departure Date:</label>
                            <input type="date" name="departure_date" id="departureDate" min="" required>
                        </div>
                        <div class="form-group return-date" id="returnDateGroup">
                            <label>Return Date:</label>
                            <input type="date" name="return_date" id="returnDate" min="" required>
                        </div>
                    </div>

                    <!-- Search Button -->
                    <div class="search-group">
                        <button type="submit" class="search-button">
                            <img src="{{ url_for('static', filename='homepage/images/Search.png') }}" alt="Search">
                        </button>
                    </div>
                </form>

                <script>
                    const today = new Date().toISOString().split('T')[0];

                    const departureDateInput = document.getElementById("departureDate");
                    const returnDateInput = document.getElementById("returnDate");

                    departureDateInput.setAttribute("min", today);
                    returnDateInput.setAttribute("min", today);
                    
                    // Set the default value to today's date
                    departureDateInput.value = today;
                    returnDateInput.value = today;

                    departureDateInput.addEventListener("change", function() {
                        const selectedDepartureDate = this.value;
                        returnDateInput.setAttribute("min", selectedDepartureDate);
                        returnDateInput.value = selectedDepartureDate;
                    });

                    const tripTypeRadios = document.querySelectorAll('input[name="trip"]');
                    tripTypeRadios.forEach(radio => {
                        radio.addEventListener('change', function() {
                            const returnDateGroup = document.getElementById('returnDateGroup');
                            if (this.value === 'oneway') {
                                returnDateGroup.style.display = 'none';
                                returnDateInput.removeAttribute("required");
                            } else {
                                returnDateGroup.style.display = 'block';
                                returnDateInput.setAttribute("required", true);
                            }
                        });
                    });

                    document.getElementById('returnDateGroup').style.display = 'none';
                    returnDateInput.removeAttribute("required");
                </script>
            </div>
        </div>
    </section>

</body>
</html>
