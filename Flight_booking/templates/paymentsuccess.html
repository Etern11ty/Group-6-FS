<!DOCTYPE html>
<html
  style="
    margin: 0;
    padding: 0;
    border: 0;
    font: inherit;
    font-size: 100%;
    -webkit-font-smoothing: antialiased;
    box-sizing: border-box;
    height: 100%;
  "
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flight Booking Success</title>
    <style>
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 768px) {
        .text-wrapper {
          font-size: 1.5rem;
        }
        .ep-success-filled {
          width: 50%;
        }
      }

      @media (max-width: 480px) {
        .text-wrapper {
          font-size: 1.2rem;
        }
        .ep-success-filled {
          width: 60%;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      border: 0;
      font: inherit;
      font-size: 100%;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
    "
  >
    <div
      class="container"
      style="
        width: 100%;
        max-width: 600px;
        padding: 20px;
        box-sizing: border-box;
        text-align: center;
        position: relative;
        top: -10%;
      "
    >
      <div
        class="overlap-group"
        style="
          position: relative;
          width: 100%;
          max-width: 400px;
          margin: 0 auto;
        "
      >
        <img
          class="ep-success-filled"
          src="{{ url_for('static', filename='paymentsuccess/check.png') }}"
          alt="Success Icon"
          style="
            width: 50%;
            max-width: 200px;
            margin-top: 20px;
            object-fit: cover;
            opacity: 0;
            animation: fadeInUp 1s ease-out forwards;
          "
        />
        <div
          class="text-wrapper"
          style="
            font-family: 'Inter-SemiBold', Helvetica, sans-serif;
            font-weight: 600;
            color: #000000;
            font-size: 3rem;
            line-height: 1.2;
            margin-top: 20px;
            opacity: 0;
            animation: fadeInUp 1s ease-out forwards;
            animation-delay: 0.3s;
          "
        >
          Flight booked successfully
        </div>
      </div>
    </div>
  </body>
</html>
